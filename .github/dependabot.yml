# Dependabot: um PR por semana e por ecossistema com as atualizações agrupadas. As de
# segurança chegam logo que saem. Cada PR passa pelo CI como os outros; o merge é à mão.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]

  # O @types/node não salta de versão maior sozinho: deve acompanhar o Node do CI e do Docker.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]

  # A app móvel segue o SDK do Expo: o Expo, o React e o React Native só mudam de versão com o
  # SDK (npx expo install --fix). Aqui entram só correções (patch) desses pacotes. O TypeScript e
  # o ESLint também: o eslint-config-expo usa a API JavaScript do TypeScript, que o TypeScript 7
  # (em Go) já não tem, e ainda não suporta o ESLint 10.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      mobile:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Imagens base do Dockerfile: só correções (ex.: 3.12-slim mais recente). O Python e o Node
  # mudam de versão à mão, em todo o lado ao mesmo tempo (Dockerfile, CI e dev container).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: terraform
    directories: [/infra/app, /infra/bootstrap]
    schedule:
      interval: weekly
