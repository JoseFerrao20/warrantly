name: Segurança

# Infraestrutura e dependências: em cada PR, no main e todas as semanas (aparecem
# vulnerabilidades novas em dependências antigas, sem nenhuma mudança no código).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # segundas às 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infra:
    name: Terraform, Dockerfile e workflows (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # As exceções aceites (e porquê) estão no .checkov.yaml.
      - name: Checkov
        run: |
          pip install --quiet checkov==3.3.29
          checkov --config-file .checkov.yaml

  dependencies:
    name: Dependências com vulnerabilidades conhecidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # O pip-audit fica num ambiente à parte, para não auditar as suas próprias dependências.
      - name: Backend (pip-audit)
        run: |
          pip install --quiet -e './backend[dev]'
          pip freeze --exclude-editable > "$RUNNER_TEMP/requirements.txt"
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet pip-audit==2.10.1
          "$RUNNER_TEMP/tools/bin/pip-audit" -r "$RUNNER_TEMP/requirements.txt" \
            --no-deps --disable-pip --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # O npm audit lê o package-lock.json; não é preciso instalar nada.
      - name: Frontend (npm audit, só o que vai para o browser)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # Na app móvel, os avisos "high" vêm das ferramentas de build do Expo e do React Native
      # (Metro, node-forge, braces), e a "correção" do npm seria descer para o Expo 44. Corrigem-se
      # ao atualizar o SDK do Expo; aqui só param o CI os críticos.
      - name: App móvel (npm audit, só críticos)
        working-directory: mobile
        run: npm audit --omit=dev --audit-level=critical
