name: Backend

on:
  push:
    branches: [main]
  pull_request:

# O token do GitHub só lê o repositório (o mínimo).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warrantly
          POSTGRES_PASSWORD: warrantly
          POSTGRES_DB: warrantly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warrantly -d warrantly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://warrantly:warrantly@localhost:5432/warrantly

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-por
          pip install -e '.[dev]'

      - name: Lint e formatação (ruff)
        run: |
          ruff check --output-format=github . ../scripts
          ruff format --check . ../scripts

      - name: Migrações (upgrade, downgrade e check)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Testes
        run: pytest
