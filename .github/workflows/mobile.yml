name: Mobile

on:
  push:
    branches: [main]
  pull_request:

# O token do GitHub só lê o repositório (o mínimo).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      # Inclui a verificação de que src/shared é igual ao do frontend.
      - name: Testes
        run: npm test

      # Empacota a app de Android com o Metro: apanha imports que o Jest não usa.
      - name: Bundle
        run: npx expo export --platform android --output-dir /tmp/expo-export
        env:
          EXPO_OFFLINE: "1"
