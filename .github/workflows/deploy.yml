name: Deploy

# Publica no Fly.io depois de o workflow "Docker" passar no main (ou à mão, em Actions).
# Precisa do segredo FLY_API_TOKEN no repositório; sem ele, o job não faz nada.
on:
  workflow_run:
    workflows: [Docker]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  fly:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Verificar o token do Fly
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::Sem FLY_API_TOKEN: deploy ignorado (ver README, secção Deploy)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.ready == 'true'

      - name: Deploy
        if: steps.token.outputs.ready == 'true'
        run: flyctl deploy --remote-only
