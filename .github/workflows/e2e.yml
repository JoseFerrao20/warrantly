name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warrantly
          POSTGRES_PASSWORD: warrantly
          POSTGRES_DB: warrantly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warrantly -d warrantly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://warrantly:warrantly@localhost:5432/warrantly

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar o backend
        run: pip install -e './backend[dev]'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar o frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar o Chromium do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # O Playwright arranca a API (com as migrações) e o Vite sozinho (ver playwright.config.ts).
      - name: Testes E2E
        working-directory: frontend
        run: npx playwright test

      - name: Guardar o relatório
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
