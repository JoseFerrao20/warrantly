services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12-bookworm
    volumes:
      - ..:/workspaces/warrantly:cached
      # A sessão e as definições do Claude Code, para não se perderem ao reconstruir o container.
      - claude-config:/home/vscode/.claude
    command: sleep infinity
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://warrantly:warrantly@db:5432/warrantly
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: warrantly
      POSTGRES_PASSWORD: warrantly
      POSTGRES_DB: warrantly
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warrantly -d warrantly"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servidor de email falso: recebe os emails da app e mostra-os em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped

volumes:
  postgres-data:
  claude-config:
