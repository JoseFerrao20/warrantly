# Configuração do Fly.io (ver "Deploy" no README). Se o nome "warrantly" já estiver ocupado,
# troca-o aqui e no workflow .github/workflows/alerts.yml (variável APP_URL).
app = "warrantly"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Corre numa máquina temporária antes de cada versão nova ficar ativa.
  release_command = "alembic upgrade head"

[env]
  ENVIRONMENT = "production"
  UPLOAD_DIR = "/data/uploads"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# As faturas ficam num volume (sobrevive a deploys e reinícios).
[[mounts]]
  source = "warrantly_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
