[project]
name = "warrantly-backend"
version = "0.1.0"
description = "API REST do Warrantly"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "email-validator",
    "pyjwt",
    "pwdlib[argon2]",
    "python-multipart",
    "reportlab",
    "pypdf",
    "pillow-heif",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Avisos de APIs obsoletas do Starlette/FastAPI falham os testes, para serem resolvidos logo.
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]
