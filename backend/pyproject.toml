[project]
name = "warrantly-backend"
version = "0.1.0"
description = "API REST do Warrantly"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "email-validator",
    "pyjwt",
    "pwdlib[argon2]",
    "python-multipart",
    "reportlab",
    "pypdf",
    "pillow-heif",
    "boto3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
    "moto[s3,ssm]",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S: regras de segurança do Bandit (subprocessos, URLs, segredos no código, ...).
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Nos testes, assert é a forma normal de verificar, e as palavras-passe são de exemplo.
"tests/**" = ["S101", "S105", "S106", "S107", "S113"]

[tool.ruff.lint.isort]
# A pasta alembic/ (migrações) não deve fazer o pacote alembic parecer local.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() como valor por omissão é o padrão do FastAPI.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Avisos de APIs obsoletas do Starlette/FastAPI falham os testes, para serem resolvidos logo.
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]
